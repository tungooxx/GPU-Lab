services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_DB: research_os
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    volumes: ["./research-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
  gpu-lab:
    build: .
    env_file: .env
    environment:
      GPU_LAB_DATA_DIR: /data
      GPU_LAB_DATABASE_URL: sqlite:////data/gpu_lab.db
      GPU_LAB_SSH_PRIVATE_KEY_PATH: /run/ssh-key
      GPU_LAB_LOCAL_WORKSPACE: /workspace/local-vlm
      GPU_LAB_RESEARCH_DATABASE_URL: postgresql://research:research@postgres:5432/research_os
      GPU_LAB_LITERATURE_PROVIDER: ${GPU_LAB_LITERATURE_PROVIDER:-disabled}
      GPU_LAB_LITERATURE_WORKER_URL: http://literature-relay:8010
      GPU_LAB_LITERATURE_WORKER_TOKEN: ${GPU_LAB_LITERATURE_WORKER_TOKEN:-}
      GPU_LAB_EXECUTABLE_PAPER_PROVIDER: ${GPU_LAB_EXECUTABLE_PAPER_PROVIDER:-disabled}
      GPU_LAB_EXECUTABLE_PAPER_WORKER_URL: http://paper2agent-relay:8020
      GPU_LAB_EXECUTABLE_PAPER_WORKER_TOKEN: ${GPU_LAB_EXECUTABLE_PAPER_WORKER_TOKEN:-}
      GPU_LAB_APPROVAL_SECRET: ${GPU_LAB_APPROVAL_SECRET:-}
      GPU_LAB_DENIED_MCP_CLIENT_CIDRS: 172.29.0.0/24,172.30.0.0/24
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/data", "gpu-lab-envs:/opt/gpu-lab/envs", "${GPU_LAB_SSH_PRIVATE_KEY_PATH:-/dev/null}:/run/ssh-key:ro", "${GPU_LAB_LOCAL_WORKSPACE_HOST:-F:/Newgeneration/VLM}:/workspace/local-vlm"]
    gpus: all
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # The gateway is deliberately not attached to worker networks. Fixed-target relays expose only
    # each authenticated worker API; untrusted workers cannot route arbitrary traffic through them.
    networks: [backend]
  literature:
    profiles: ["literature"]
    build:
      context: .
      dockerfile: literature.Dockerfile
    environment:
      GPU_LAB_LITERATURE_WORKER_TOKEN: ${GPU_LAB_LITERATURE_WORKER_TOKEN:-}
      GPU_LAB_PAPERQA_DIRECTORY: /papers
      PQA_HOME: /papers/.pqa
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GPU_LAB_PAPERQA_BASE_URL: ${GPU_LAB_PAPERQA_BASE_URL:-}
      GPU_LAB_PAPERQA_MODEL: ${GPU_LAB_PAPERQA_MODEL:-}
      GPU_LAB_PAPERQA_MAX_RETRIES: ${GPU_LAB_PAPERQA_MAX_RETRIES:-2}
      CROSSREF_API_KEY: ${CROSSREF_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
    volumes: ["literature-papers:/papers"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/health', data=b'{}')).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [literature]
  paper2agent:
    profiles: ["paper-agents"]
    build:
      context: .
      dockerfile: paper2agent.Dockerfile
    environment:
      GPU_LAB_EXECUTABLE_PAPER_WORKER_TOKEN: ${GPU_LAB_EXECUTABLE_PAPER_WORKER_TOKEN:-}
      PAPER2AGENT_ROOT: /opt/paper2agent
      PAPER2AGENT_UPSTREAM_COMMIT: e573687e15f345e3f375cd0851373d588e436be3
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
    volumes: ["paper2agent-projects:/opt/paper2agent/projects", "paper2agent-claude:/home/paperagent/.claude"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    pids_limit: 512
    cpus: 4.0
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8020/health', data=b'{}'))); assert data.get('result', {}).get('status') == 'ready'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [paper-agents]
  literature-relay:
    profiles: ["literature"]
    build:
      context: .
      dockerfile: relay.Dockerfile
    environment:
      RELAY_TARGET_HOST: literature
      RELAY_TARGET_PORT: 8010
      RELAY_LISTEN_PORT: 8010
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [backend, literature]
  paper2agent-relay:
    profiles: ["paper-agents"]
    build:
      context: .
      dockerfile: relay.Dockerfile
    environment:
      RELAY_TARGET_HOST: paper2agent
      RELAY_TARGET_PORT: 8020
      RELAY_LISTEN_PORT: 8020
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [backend, paper-agents]
  egress-proxy:
    profiles: ["literature", "paper-agents"]
    build:
      context: .
      dockerfile: egress-proxy.Dockerfile
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [literature, paper-agents, egress]

volumes:
  gpu-lab-envs:
  literature-papers:
  paper2agent-projects:
  paper2agent-claude:

networks:
  backend:
    ipam:
      config: [{subnet: 172.28.0.0/24}]
  literature:
    internal: true
    ipam:
      config: [{subnet: 172.29.0.0/24}]
  paper-agents:
    internal: true
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  egress: {}
