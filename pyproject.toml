[project]
name = "gpu-lab-mcp"
version = "0.1.0"
description = "A safe MCP experiment control plane for remote GPUs"
requires-python = ">=3.12"
dependencies = [
  "asyncssh>=2.21,<3",
  "httpx>=0.28,<1",
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
# PaperQA follows CalVer without cross-release compatibility guarantees. Keep this adapter on the
# audited 2026 API family and install it only in an isolated literature worker/environment.
literature = ["paper-qa>=2026.3.18,<2027"]

[project.scripts]
gpu-lab-mcp = "gpu_lab.server:main"
gpu-lab = "gpu_lab.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_lab"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
